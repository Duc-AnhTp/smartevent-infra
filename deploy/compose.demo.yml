name: smartevent-demo

x-service-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *defaults
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    <<: *defaults
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    <<: *defaults
    build:
      context: ../../smartevent-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-smart-event-bucket}
      APP_FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_DOCS_PUBLIC: "false"
      APP_MAIL_ENABLED: "false"
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api/v1/payments/vnpay/return
      VNPAY_IPN_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api/v1/payments/vnpay/ipn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    <<: *defaults
    build:
      context: ../../ai-service
    environment:
      APP_ENV: production
      BACKEND_BASE_URL: http://backend:8080
      NLU_BACKEND: ${NLU_BACKEND:-rule}
      RAG_BACKEND: ${RAG_BACKEND:-extractive}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NLU_MODEL: ${OLLAMA_NLU_MODEL:-smartevent-nlu:1.5b}
      OLLAMA_RAG_MODEL: ${OLLAMA_RAG_MODEL:-smartevent-rag:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-10}
      POLICY_BACKEND: ${POLICY_BACKEND:-artifact}
      KNOWLEDGE_BASE_URL: http://knowledge-reader:8010
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
    depends_on:
      - backend

  frontend:
    <<: *defaults
    build:
      context: ../../smartevent-web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    environment:
      API_BASE_URL: http://backend:8080
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - backend
      - ai-service

  # Deliberately opt-in: complete the seed-account lock step before exposing the app.
  caddy:
    <<: *defaults
    profiles: [public]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:?Set PORTFOLIO_DOMAIN}
    volumes:
      - ./${CADDYFILE:-Caddyfile.portfolio}:/etc/caddy/Caddyfile:ro
      - ../../smartevent-portfolio/dist:/srv/portfolio:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  caddy-data:
  caddy-config:

# Optional knowledge services are defined in compose.knowledge.yml.
# Add -f compose.knowledge.yml --profile knowledge; defaults do not enable business tools.
